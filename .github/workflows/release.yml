name: Release

# Push a tag like v0.4.0 (must match the version in pyproject.toml) to publish to PyPI
# and attach the Claude Desktop extension (.mcpb) to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check tag matches package version
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - run: uv build
      - name: Smoke test the wheel
        run: uvx --from dist/*.whl zhaw-moodle-mcp --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted Publishing: no API token, PyPI trusts this workflow + environment
    environment:
      name: pypi
      url: https://pypi.org/p/zhaw-moodle-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  extension:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked
      - run: uv run python scripts/build_extension.py
      - name: Create GitHub release with the extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.mcpb
          --title "$GITHUB_REF_NAME"
          --notes "Claude Desktop: download zhaw-moodle-*.mcpb and open it (or Settings → Extensions → Install Extension). Python package: https://pypi.org/project/zhaw-moodle-mcp/"
