[project]
name = "zhaw-moodle-mcp"
version = "0.3.0"
description = "MCP server for ZHAW Moodle: courses, learning materials, downloads and sync via SWITCH edu-ID browser login"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "moodle", "zhaw", "claude", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
authors = [
    { name = "Dathis", email = "danilvolodimirovich@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "mcp>=2.2.0",
    "platformdirs>=4.11.8",
    "playwright>=1.63.0",
    "tzdata>=2026.4",
]

[project.urls]
Homepage = "https://github.com/Dathis/zhaw-moodle-mcp"
Issues = "https://github.com/Dathis/zhaw-moodle-mcp/issues"

[project.scripts]
zhaw-moodle-mcp = "zhaw_moodle_mcp:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
# local file I/O is small and fast; ternaries are not always clearer
ignore = ["ASYNC230", "ASYNC240", "SIM108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
